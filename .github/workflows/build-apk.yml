name: Build key-hiding levels

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        level: [plain, base64, xor, split, dartdefine]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Select level
        run: cp lib/levels/${{ matrix.level }}.dart lib/key_source.dart

      - name: Build plain and obfuscated APKs
        run: |
          DEFINES=""
          if [ "${{ matrix.level }}" = "dartdefine" ]; then
            DEFINES="--dart-define=API_KEY=FAKE-KEY-12345-ABCDE"
          fi
          mkdir -p out
          flutter build apk --release $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk out/${{ matrix.level }}-plain.apk
          flutter build apk --release --obfuscate --split-debug-info=build/symbols $DEFINES
          cp build/app/outputs/flutter-apk/app-release.apk out/${{ matrix.level }}-obfuscated.apk

      - name: Search APKs for the key
        run: |
          for f in out/*.apk; do
            rm -rf x && mkdir x && unzip -q "$f" -d x
            echo "== $f"
            for p in "FAKE-KEY-12345-ABCDE" "RkFLRS1LRVktMTIzNDUtQUJDREU=" "ABCDE"; do
              n=$(grep -raoF -- "$p" x | wc -l)
              echo "   '$p' -> $n match(es)"
            done
          done | tee out/results.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ matrix.level }}
          path: out/*
