name: Build Flutter APKs

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - run: flutter pub get

      # Variant 1: plain release build (no obfuscation)
      - name: Build plain release APK
        run: |
          flutter build apk --release
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/app-plain.apk

      # Variant 2: obfuscated release build
      - name: Build obfuscated release APK
        run: |
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk out/app-obfuscated.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk